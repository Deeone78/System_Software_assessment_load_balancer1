services:
  ntu-vm-comp20081:
    container_name: ntu-vm-comp20081
    image: pedrombmachado/ntu_lubuntu:comp20081
    ports:
      - "3390:3389"
      - "2022:22"
    hostname: ntu-vm-comp20081
    volumes:
      - ./JavaFXApplication1:/home/ntu-user/NetBeansProjects
    networks:
      - comp20081_network
      - cloud-backplane

  db-node:
    image: mysql:8.0
    container_name: lbc_mysql_registry
    restart: always
    environment:
      MYSQL_DATABASE: lbcsystem
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./sql-init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-backplane

  file-partitioner:
    build:
      context: .
      dockerfile: Dockerfile.partitioner
    container_name: lbc_partitioner
    environment:
      - HEADLESS_MODE=true
    networks:
      - cloud-backplane

  load-balancer:
    build:
      context: .
      dockerfile: Dockerfile.lb
    container_name: lbc_load_balancer
    ports:
      - "8080:8080"
    environment:
      - HEADLESS_MODE=true
    depends_on:
      db-node:
        condition: service_healthy
    volumes:                                   
      - ./cloud_storage:/cloud_storage
    networks:
      - cloud-backplane

  host-manager:
    image: alpine
    container_name: lbc_host_manager
    command: tail -f /dev/null
    networks:
      - cloud-backplane

  storage-node-1:
    build:
      context: .
      dockerfile: Dockerfile.storage
    container_name: lbc_storage_01
    volumes:
      - ./cloud_storage/server1:/data
    networks:
      - cloud-backplane

  storage-node-2:
    build:
      context: .
      dockerfile: Dockerfile.storage
    container_name: lbc_storage_02
    volumes:
      - ./cloud_storage/server2:/data
    networks:
      - cloud-backplane

  storage-node-3:
    image: alpine
    container_name: lbc_storage_03
    command: tail -f /dev/null
    volumes:
      - ./cloud_storage/server3:/data
    networks:
      - cloud-backplane

  storage-node-4:
    image: alpine
    container_name: lbc_storage_04
    command: tail -f /dev/null
    volumes:
      - ./cloud_storage/server4:/data
    networks:
      - cloud-backplane

  cloud-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lbc_main_gateway
    depends_on:
      db-node:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://db-node:3306/lbcsystem
      - HEADLESS_MODE=true
    networks:
      - cloud-backplane

volumes:
  mysql_data:

networks:
  cloud-backplane:
    driver: bridge
  comp20081_network:
    driver: bridge