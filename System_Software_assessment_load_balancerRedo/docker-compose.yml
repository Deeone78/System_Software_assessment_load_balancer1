services:
  # NTU Lubuntu virtual machine - connect via RDP on localhost:3390
  ntu-vm-comp20081:
    container_name: ntu-vm-comp20081
    image: pedrombmachado/ntu_lubuntu:comp20081
    ports:
      - "3390:3389"
      - "2022:22"
    hostname: ntu-vm-comp20081
    volumes:
      - docker_comp20081:/home/ntu-user/NetBeansProjects
    networks:
      - comp20081_network
      - cloud-backplane

  # MySQL database - service name matches the hostname used in DB.java
  # FIX: original service was named "db-node" but DB.java connects to "lbc_mysql_registry"
  lbc_mysql_registry:
    image: mysql:8.0
    container_name: lbc_mysql_registry
    restart: always
    environment:
      MYSQL_DATABASE: lbcsystem
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./sql-init:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloud-backplane

  # File partitioner service
  # FIX: build context was "C:/System_Software_assessment_load_balancerRedo" - changed to "."
  # FIX: CMD class was "Partitioner" - changed to "FilePartitioner" in Dockerfile.partitioner
  file-partitioner:
    build:
      context: .
      dockerfile: Dockerfile.partitioner
    container_name: lbc_partitioner
    environment:
      - HEADLESS_MODE=true
    networks:
      - cloud-backplane

  # Load balancer - proxies requests to storage nodes, exposed on host port 8080
  # FIX: build context was "C:/System_Software_assessment_load_balancerRedo" - changed to "."
  load-balancer:
    build:
      context: .
      dockerfile: Dockerfile.lb
    container_name: lbc_load_balancer
    ports:
      - "8080:8080"
    environment:
      - HEADLESS_MODE=true
    depends_on:
      lbc_mysql_registry:
        condition: service_healthy
    networks:
      - cloud-backplane

  # Placeholder host manager
  host-manager:
    image: alpine
    container_name: lbc_host_manager
    command: tail -f /dev/null
    networks:
      - cloud-backplane

  # Storage node 1 - service name matches hostname used in LoadBalancer.java
  # FIX: build context was "C:/System_Software_assessment_load_balancerRedo" - changed to "."
  lbc_storage_01:
    build:
      context: .
      dockerfile: Dockerfile.storage
    container_name: lbc_storage_01
    volumes:
      - ./cloud_storage/server1:/data
    networks:
      - cloud-backplane

  # Storage node 2
  # FIX: build context was "C:/System_Software_assessment_load_balancerRedo" - changed to "."
  lbc_storage_02:
    build:
      context: .
      dockerfile: Dockerfile.storage
    container_name: lbc_storage_02
    volumes:
      - ./cloud_storage/server2:/data
    networks:
      - cloud-backplane

  # Storage node 3
  # FIX: was "image: alpine / command: tail -f /dev/null" - now runs the real StorageServer
  lbc_storage_03:
    build:
      context: .
      dockerfile: Dockerfile.storage
    container_name: lbc_storage_03
    volumes:
      - ./cloud_storage/server3:/data
    networks:
      - cloud-backplane

  # Storage node 4
  # FIX: was "image: alpine / command: tail -f /dev/null" - now runs the real StorageServer
  lbc_storage_04:
    build:
      context: .
      dockerfile: Dockerfile.storage
    container_name: lbc_storage_04
    volumes:
      - ./cloud_storage/server4:/data
    networks:
      - cloud-backplane

  # Main cloud app gateway (runs headless in container for demonstration)
  # FIX: build context was "C:/System_Software_assessment_load_balancerRedo" - changed to "."
  cloud-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lbc_main_gateway
    depends_on:
      lbc_mysql_registry:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:mysql://lbc_mysql_registry:3306/lbcsystem
      - HEADLESS_MODE=true
    networks:
      - cloud-backplane

volumes:
  mysql_data:
  docker_comp20081:

networks:
  cloud-backplane:
    driver: bridge
  comp20081_network:
    driver: bridge
